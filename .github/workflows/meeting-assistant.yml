name: Meeting assistant checks

on:
  push:
    paths: ['meeting-assistant/**', '.github/workflows/meeting-assistant.yml']
  pull_request:
    paths: ['meeting-assistant/**', '.github/workflows/meeting-assistant.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: meeting-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python evaluation/run.py
